name: CPU validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Install pinned dependencies in a fresh environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated --disable-pip-version-check install --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple -r requirements.lock
          .venv/bin/python -m pip --isolated check
      - name: Fetch and verify pinned reference data
        run: |
          .venv/bin/python tools/fetch_reference.py
          .venv/bin/python tools/fetch_reference.py --verify-only
      - name: Run complete CPU test suite
        run: .venv/bin/python tools/run_tests.py
      - name: Check public CLI output
        run: .venv/bin/python tools/check_cli.py
